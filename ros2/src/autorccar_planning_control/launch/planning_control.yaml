/**:
  ros__parameters:
    controller:
      goal_reach_threshold: 0.3 # [m]
      target_speed: 1.0 # [m/s]
      nav_hz: 100 # [Hz]
      control_hz: 50 # [Hz]
      accel: 0.5 # [m/s^2]
      decel: 0.5 # [m/s^2]
      pure_pursuiter:
        look_ahead_distance: 2.0 # [m]

    frenet_optimal:
      max_speed: 4.0 # [m/s]
      max_accel: 2.0 # [m/ss]
      max_curvature: 5.0 # [1/m]
      max_road_width: 3.0 # [m]
      d_road_width: 0.5 # road width sampling length [m]
      dt: 0.2 # [s]
      max_t: 5.0 # max prediction time [s]
      min_t: 4.0 # min prediction time [s]
      d_target_speed: 1.0 # target speed sampling length [m/s]
      n_speed_sample: 3 # sampling number of target speed
      robot_radius: 0.3 # [m]
      k_j: 0.1
      k_t: 0.1
      k_d: 1.0
      k_lat: 1.0
      k_lon: 1.0

    dwa_optimal:
      max_speed: 4.0 # [m/s]
      min_speed: 0.0 # [m/s], set negative to allow reverse sampling
      max_accel: 2.0 # [m/ss]
      max_steering_rate: 3.0 # [rad/s]
      speed_samples: 7 # number of velocity samples in the dynamic window
      steering_samples: 15 # number of steering samples in the dynamic window
      predict_time: 2.5 # forward simulation horizon [s]
      dt: 0.1 # forward simulation step [s]
      look_ahead_distance: 2.0 # local goal look-ahead along global path [m]
      robot_radius: 0.3 # [m] collision margin around bounding boxes
      k_obstacle: 5.0
      k_heading: 1.5
      k_distance: 1.0
      k_velocity: 0.8
      k_smoothness: 0.3
      k_path = 1.0;

    simulator:
      simulation_hz: 500 # [Hz]
      nav_pub_hz: 100 # [Hz]
      bounding_box_pub_hz: 10 # [Hz]

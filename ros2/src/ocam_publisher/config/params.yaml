/**:
  ros__parameters:
    device_path: ""           # Leave it blank for auto detection

    # Both modes publish one 640 x 480 rgb8 /image_topic at the configured FPS.
    # native_downsample: 1280 x 960 GRBG capture, demosaic, then INTER_AREA downsample.
    # hardware_binned: 640 x 480 GRBG capture, then demosaic only.
    capture_mode: "native_downsample"
    OutputWidth: 640
    OutputHeight: 480
    FPS: 30
    frame_timeout_sec: 5.0
    frame_id: "ocam_optical_frame"

    Brightness: 128           # Manual gain (camera range: 0 to 255)
    Exposure: 128             # 100 us units: 128 = 12.8 ms
    Auto exposure mode: 1     # 1 - Manual mode, 3 - Apeture priority mode

gamepad_control_node:
  ros__parameters:

    # -- Topic Names ---------------------------------------------------
    joy_topic: "/joy"    # Joy topic to subscribe to
    teleop_control_command_topic: "/teleop/control_command"
    teleop_command_topic: "/teleop/command"
    #accel_topic: "/accel"  # Acceleration topic to publish
    #steer_topic: "/steer"  # Steering topic to publish

    # -- Axes Index Mapping --------------------------------------------
    # DualSense Joystick (Based on CFI-ZCT1G):
    accel_axis_index: 3   # Left Trigger (L2) -> Acceleration/Deceleration
    steer_axis_index: 2   # Right Stick Horizontal -> Steering
    stop_index : 0        # Square button
    manual_index : 1      # Cross button (X)
    auto_index : 2        # Circle button
    tbd_index : 3         # Triangle button
    reset_index : 4       # L1 Shoulder button
    reset2_index : 5      # R1 Shoulder button

    # -- Scale ---------------------------------------------------------
    # Published Value = Raw Axes Value × Scale (Raw Range: -1.0 ~ 1.0)
    accel_scale: 1.0
    steer_scale: 1.0

    # -- Deadzone ------------------------------------------------------
    # If |axes value| < deadzone, it is treated as 0.0
    deadzone: 0.05